name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release metadata
        run: |
          test "${GITHUB_REF_NAME}" = "v0.9.0"
          grep -q '^## \[0.9.0\] - 2026-08-18$' CHANGELOG.md
          grep -q '^version: 0.9.0$' deployments/helm/aegisflow/Chart.yaml

      - name: Test source
        run: go test ./... -count=1

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "aegisflow-${target}" ./cmd/aegisflow
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "aegisctl-${target}" ./cmd/aegisctl
          done

      - name: Verify release binaries
        run: |
          test "$(./aegisflow-linux-amd64 --version)" = "aegisflow ${GITHUB_REF_NAME}"
          test "$(./aegisctl-linux-amd64 version)" = "aegisctl ${GITHUB_REF_NAME}"

      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: aegisflow-v0.9.0.spdx.json
          artifact-name: aegisflow-v0.9.0.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Create checksums
        run: |
          sha256sum \
            aegisflow-linux-amd64 \
            aegisflow-linux-arm64 \
            aegisflow-darwin-amd64 \
            aegisflow-darwin-arm64 \
            aegisctl-linux-amd64 \
            aegisctl-linux-arm64 \
            aegisctl-darwin-amd64 \
            aegisctl-darwin-arm64 \
            aegisflow-v0.9.0.spdx.json > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 9

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Create build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            aegisflow-linux-amd64
            aegisflow-linux-arm64
            aegisflow-darwin-amd64
            aegisflow-darwin-arm64
            aegisctl-linux-amd64
            aegisctl-linux-arm64
            aegisctl-darwin-amd64
            aegisctl-darwin-arm64
            SHA256SUMS
            SHA256SUMS.sigstore.json
            aegisflow-v0.9.0.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "v0.9.0: tool boundary hardening"
          body_path: docs/releases/v0.9.0.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            aegisflow-linux-amd64
            aegisflow-linux-arm64
            aegisflow-darwin-amd64
            aegisflow-darwin-arm64
            aegisctl-linux-amd64
            aegisctl-linux-arm64
            aegisctl-darwin-amd64
            aegisctl-darwin-arm64
            SHA256SUMS
            SHA256SUMS.sigstore.json
            aegisflow-v0.9.0.spdx.json
