name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Release metadata validation tests
        run: python3 scripts/test_release_metadata.py

      - name: Installer verification
        run: bash scripts/test_install.sh

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Test
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: CLI reliability E2E
        run: python3 scripts/e2e_cli.py

      - name: Approval security E2E
        run: bash scripts/e2e_approval_security.sh

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Compose smoke test
        run: bash scripts/compose_smoke.sh
