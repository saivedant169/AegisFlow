name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKERHUB_IMAGE: docker.io/saivedant169/aegisflow
  DOCKERHUB_OPERATOR_IMAGE: docker.io/saivedant169/aegisflow-operator
  GHCR_IMAGE: ghcr.io/saivedant169/aegisflow
  GHCR_OPERATOR_IMAGE: ghcr.io/saivedant169/aegisflow-operator

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Extract gateway image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract operator image metadata
        id: meta-operator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_OPERATOR_IMAGE }}
            ${{ env.GHCR_OPERATOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway image
        id: build-gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push operator image
        id: build-operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign gateway image digests
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-gateway.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sign_digest() {
            image="$1"
            for attempt in 1 2 3; do
              cosign sign --yes "${image}@${DIGEST}" && return 0
              [ "${attempt}" -eq 3 ] && return 1
              sleep $((attempt * 60))
            done
          }
          while IFS= read -r image; do
            sign_digest "${image}"
          done < <(sed 's/:[^:]*$//' <<< "${TAGS}" | sort -u)

      - name: Sign operator image digests
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-operator.outputs.digest }}
          TAGS: ${{ steps.meta-operator.outputs.tags }}
        run: |
          sign_digest() {
            image="$1"
            for attempt in 1 2 3; do
              cosign sign --yes "${image}@${DIGEST}" && return 0
              [ "${attempt}" -eq 3 ] && return 1
              sleep $((attempt * 60))
            done
          }
          while IFS= read -r image; do
            sign_digest "${image}"
          done < <(sed 's/:[^:]*$//' <<< "${TAGS}" | sort -u)

      - name: Update gateway Docker Hub page
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: saivedant169/aegisflow
          short-description: Runtime policy gateway for coding agents and tool-using agents
          readme-filepath: ./DOCKERHUB.md
          enable-url-completion: true

      - name: Update operator Docker Hub page
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: saivedant169/aegisflow-operator
          short-description: Kubernetes operator for AegisFlow runtime governance
          readme-filepath: ./DOCKERHUB_OPERATOR.md
          enable-url-completion: true
